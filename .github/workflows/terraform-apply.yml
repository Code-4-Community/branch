name: Terraform Apply by PR / button

on:
  push:
    branches:
      - main
    paths:
      - 'infrastructure/**/*.tf'
      - 'infrastructure/**/*.tfvars'
      - 'infrastructure/**/terraform.lock.hcl'
      - 'infrastructure/**/.terraform-version'
  workflow_dispatch:
    inputs:
      directories:
        description: >
          Comma-separated list of Terraform workspace directories to apply.
          Examples: infrastructure/github or infrastructure/github,infrastructure/another
          Notes: Leave empty on merges; push to main auto-detects changed workspaces.
        required: false
        default: ''

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      terraform-dirs: ${{ steps.set-dirs.outputs.dirs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files (push only)
        id: changed-files
        if: github.event_name == 'push'
        uses: tj-actions/changed-files@v44
        with:
          files: |
            **/*.tf
            **/*.tfvars
            **/terraform.lock.hcl
            **/.terraform-version
          files_separator: "\n"
          files_yaml: |
            terraform:
              - '**/*.tf'
              - '**/*.tfvars'
              - '**/terraform.lock.hcl'
              - '**/.terraform-version'

      - name: List all changed files (push only)
        if: github.event_name == 'push' && steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "Changed terraform files:"
          echo "${{ steps.changed-files.outputs.all_changed_files }}"

      - name: Resolve directories to apply
        id: set-dirs
        run: |
          EVENT_NAME="${{ github.event_name }}"
          INPUT_DIRS="${{ github.event.inputs.directories }}"
          ANY_CHANGED="${{ steps.changed-files.outputs.any_changed }}"
          ALL_CHANGED="${{ steps.changed-files.outputs.all_changed_files }}"

          dirs_json='[]'

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Parse comma-separated directories, trim, and keep existing paths only
            if [ -n "$INPUT_DIRS" ]; then
              echo "$INPUT_DIRS" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | while read -r d; do
                if [ -n "$d" ] && [ -d "$d" ]; then echo "$d"; fi
              done | jq -R -s -c 'split("\n") | map(select(length>0))' > dirs.json
              dirs_json=$(cat dirs.json)
            fi
          elif [ "$ANY_CHANGED" = "true" ]; then
            # Derive unique directories from changed files on push
            echo "$ALL_CHANGED" | tr ' ' '\n' | xargs -I {} dirname {} | sort -u | jq -R -s -c 'split("\n")[:-1]' > dirs.json
            dirs_json=$(cat dirs.json)
          fi

          echo "Resolved directories: $dirs_json"
          echo "dirs=$dirs_json" >> $GITHUB_OUTPUT

  # Post the initial "Deploying infrastructure" Slack message before applies run.
  prep:
    needs: detect-changes
    if: needs.detect-changes.outputs.terraform-dirs != '' && needs.detect-changes.outputs.terraform-dirs != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ts: ${{ steps.slack.outputs.ts }}
      total: ${{ steps.count.outputs.total }}
    steps:
      - uses: actions/checkout@v4
      - name: Count workspaces
        id: count
        env:
          DIRS: ${{ needs.detect-changes.outputs.terraform-dirs }}
        run: echo "total=$(echo "$DIRS" | jq 'length')" >> "$GITHUB_OUTPUT"
      - name: Start deploy notification
        id: slack
        uses: ./.github/actions/slack-deploy
        with:
          mode: start
          component: infrastructure
          total-steps: ${{ steps.count.outputs.total }}
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  terraform-apply:
    needs: [detect-changes, prep]
    if: needs.detect-changes.outputs.terraform-dirs != '' && needs.detect-changes.outputs.terraform-dirs != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: ${{ fromJson(needs.detect-changes.outputs.terraform-dirs) }}
      fail-fast: false
    environment: production
    permissions:
      id-token: write # assume the OIDC apply role
      contents: read
      actions: read # count completed legs for the live status bar
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tfenv
        run: |
          git clone --depth=1 https://github.com/tfutils/tfenv.git ~/.tfenv
          echo "$HOME/.tfenv/bin" >> $GITHUB_PATH

      - name: Install Terraform via tfenv
        run: |
          cd "${{ matrix.directory }}"
          tfenv install
          terraform version

      - name: Configure AWS credentials (write apply role via OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::489881683177:role/branch-ci-apply
          aws-region: us-east-2

      - name: Terraform Init
        id: init
        run: terraform init
        working-directory: ${{ matrix.directory }}
        env:
          TF_VAR_infisical_client_id: ${{ secrets.INFISICAL_CLIENT_ID }}
          TF_VAR_infisical_client_secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}

      - name: Terraform Validate
        id: validate
        run: terraform validate
        working-directory: ${{ matrix.directory }}

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -input=false -out=tfplan
        working-directory: ${{ matrix.directory }}
        env:
          TF_VAR_infisical_client_id: ${{ secrets.INFISICAL_CLIENT_ID }}
          TF_VAR_infisical_client_secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}

      - name: Terraform Apply
        id: apply
        run: |
          set -o pipefail
          terraform apply -auto-approve -no-color tfplan 2>&1 | tee apply.log
        working-directory: ${{ matrix.directory }}
        env:
          TF_VAR_infisical_client_id: ${{ secrets.INFISICAL_CLIENT_ID }}
          TF_VAR_infisical_client_secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}

      - name: Compute result name
        id: rname
        if: always()
        run: echo "name=$(echo '${{ matrix.directory }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Save apply result
        if: always()
        run: |
          mkdir -p tf-results
          echo "${{ matrix.directory }}|${{ steps.apply.outcome }}" > "tf-results/${{ steps.rname.outputs.name }}.meta"
          cp "${{ matrix.directory }}/apply.log" "tf-results/${{ steps.rname.outputs.name }}.log" 2>/dev/null \
            || echo "(no apply output captured)" > "tf-results/${{ steps.rname.outputs.name }}.log"

      - name: Upload apply result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tf-result-${{ steps.rname.outputs.name }}
          path: tf-results/
          if-no-files-found: warn

      - name: Thread step (live)
        if: always()
        uses: ./.github/actions/slack-deploy
        with:
          mode: step
          component: infrastructure
          total-steps: ${{ needs.prep.outputs.total }}
          job-name: terraform-apply
          step-name: Applied ${{ matrix.directory }}
          step-status: ${{ steps.apply.outcome }}
          details-file: ${{ matrix.directory }}/apply.log
          ts: ${{ needs.prep.outputs.ts }}
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create deployment summary
        if: always()
        run: |
          echo "## Terraform Apply Summary - ${{ matrix.directory }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Init | ${{ steps.init.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Validate | ${{ steps.validate.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Plan | ${{ steps.plan.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Apply | ${{ steps.apply.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.apply.outcome }}" == "success" ]; then
            echo "✅ **Terraform apply completed successfully!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Terraform apply failed!**" >> $GITHUB_STEP_SUMMARY
          fi

  notify:
    needs: [detect-changes, prep, terraform-apply]
    if: always() && needs.detect-changes.outputs.terraform-dirs != '' && needs.detect-changes.outputs.terraform-dirs != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download apply results
        uses: actions/download-artifact@v4
        with:
          pattern: tf-result-*
          path: tf-results
          merge-multiple: true

      - name: Finalize deploy notification
        uses: ./.github/actions/slack-deploy
        with:
          mode: finalize
          component: infrastructure
          total-steps: ${{ needs.prep.outputs.total }}
          results-dir: tf-results
          ts: ${{ needs.prep.outputs.ts }}
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}



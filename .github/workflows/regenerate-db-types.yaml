name: Schema Change Checks

on:
  pull_request:
    paths:
      - apps/backend/db/migrations/**
  workflow_dispatch:


permissions:
  contents: write
  pull-requests: write

env:
  # Matches the lambda runtime (nodejs20.x) and every other workflow.
  NODE_VERSION: '20'
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb

jobs:
  regenerate-types:
    name: Auto-regenerate DB Types
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request'
    
    steps:
        - name: Checkout
          uses: actions/checkout@v4
          with:
            ref: ${{ github.head_ref || github.ref }}
            token: ${{ secrets.GITHUB_TOKEN }}
            fetch-depth: 0
        
        # Posted before anything can fail, so the guidance is on the PR even if a
        # later step breaks. Sticky: updated in place on every push rather than
        # re-commented, which would get the bot muted.
        - name: Comment migration checklist on the PR
          if: github.event_name == 'pull_request'
          uses: actions/github-script@v7
          with:
            script: |
              const { execSync } = require('child_process');
              const base = context.payload.pull_request.base.sha;
              const mergeBase = execSync(`git merge-base ${base} HEAD`).toString().trim();
              const added = execSync(
                `git diff --diff-filter=A --name-only ${mergeBase} HEAD -- apps/backend/db/migrations`,
              ).toString().trim().split('\n').filter(Boolean);

              const outside = execSync(
                `git diff --name-only ${mergeBase} HEAD -- . ':(exclude)apps/backend/db'`,
              ).toString().trim().split('\n').filter(Boolean);

              const MARKER = '<!-- branch-migration-notice -->';
              const list = added.length
                ? added.map((f) => `- \`${f}\``).join('\n')
                : '_(no newly added migration files in this PR)_';

              let body = `${MARKER}
              ### This PR contains a database migration

              ${list}

              **It will be applied to the production database automatically when this PR merges**, before the new lambda code is deployed. Please confirm before requesting review:

              - [ ] **Applied and tested locally.** \`cd apps/backend && make migrate\`, then run the affected lambda's tests (\`cd apps/backend/lambdas/<name> && npm test\`). \`make show-migrations\` shows what applied.
              - [ ] **Safe for the code that is live right now.** During the deploy window -- and indefinitely if the deploy fails -- the currently deployed lambdas run against your new schema. Additive changes (\`CREATE TABLE\`, nullable \`ADD COLUMN\`, \`CREATE INDEX\`) are fine in one PR. \`DROP COLUMN\`, renames, \`ADD COLUMN NOT NULL\` with no default, and new \`UNIQUE\`/\`CHECK\`/\`FOREIGN KEY\` constraints need two merged PRs -- see the expand/contract rules in \`apps/backend/db/README.md\`.
              - [ ] **Kept separate from unrelated changes.** A migration PR should ideally contain the migration, the code that needs it, and nothing else. It changes production state, it is the one thing here that redeploying cannot roll back, and a reviewer should be able to see the whole schema change without scrolling past unrelated work.
              - [ ] **No already-merged migration was edited.** Fix an old migration by adding a new one; there is no \`down\`.

              \`shared/types/db-types.d.ts\` is regenerated and pushed to this branch automatically -- don't hand-edit it. Expect one red \`migrations-fresh\` check before that commit lands.`;

              if (outside.length > 15) {
                body += `\n\nThis PR also changes ${outside.length} files outside \`apps/backend/db/\`. If any are unrelated to this schema change, consider splitting them into a separate PR.`;
              }

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              const existing = comments.find((c) => c.body?.includes(MARKER));

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  comment_id: existing.id, body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: context.issue.number, body,
                });
              }

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: ${{ env.NODE_VERSION }}
            cache: 'npm'

        - name: Cache npm dependencies
          uses: actions/cache@v4
          with:
            path: ~/.npm
            key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
            restore-keys: |
              ${{ runner.os }}-node-
        
        - name: Install dependencies
          run: |
            echo "Installing project dependencies"
            npm ci --legacy-peer-deps

            # apps/backend/db pins kysely-codegen. Installing it globally instead
            # would let CI generate types with a different version than a
            # contributor's `make types` run.
            echo "Installing db tooling"
            npm ci --prefix apps/backend/db --no-audit --no-fund
        
        - name: Setup PostgreSQL
          uses: ikalnytskyi/action-setup-postgres@v6
          with:
            username: postgres
            password: postgres
            database: testdb
            port: 5432
          id: postgres
          
        - name: Verify PostgreSQL connection
          run: |
            echo "Testing PostgreSQL connection"
            psql -h localhost -U postgres -d testdb -c "SELECT version();"
          env:
            PGPASSWORD: postgres

        - name: Build schema from migrations
          run: |
            echo "Applying db/migrations"
            npm run migrate --prefix apps/backend/db

            echo "Verifying schema application"
            psql -h localhost -U postgres -d testdb -c "\dt branch.*"
          env:
            PGPASSWORD: postgres
            DATABASE_URL: ${{ env.DATABASE_URL }}

        # Both the codegen invocation and the kysely-ColumnType rewrite live in
        # apps/backend/db/src/, so this produces byte-identical output to a
        # contributor's `make types` -- rather than two copies kept in sync by hand.
        - name: Generate types
          run: npm run types --prefix apps/backend/db
          env:
            DATABASE_URL: ${{ env.DATABASE_URL }}

        - name: Verify TypeScript compilation
          run: |
            echo "Verifying TypeScript compilation"

            # check if tsconfig.json exists

            if [ ! -f "tsconfig.json" ]; then
              echo "Warning: tsconfig.json not found in root, skipping full compilation check"
              echo "Performing basic syntax check on generated types..."
              
              # Ensure the file is valid TypeScript
              npx tsc --noEmit --skipLibCheck shared/types/db-types.d.ts || {
                echo "Error: shared/types/db-types.d.ts contains TypeScript errors"
                exit 1
              }
            else
              npx tsc --noEmit --skipLibCheck || {
                echo "Error: TypeScript compilation failed"
                echo "The generated database types may be incompatible with the codebase."
                exit 1
              }
            fi

            echo "TypeScript compilation successful"
            
        - name: Check for changes
          id: git-check
          run: |
            git add -N shared/types/db-types.d.ts
            
            if git diff --exit-code shared/types/db-types.d.ts; then
              echo "changes=false" >> $GITHUB_OUTPUT
              echo "No changes detected in generated types"
            else
              echo "changes=true" >> $GITHUB_OUTPUT
              echo "Changes detected in generated types"
          
              echo "Changed files:"
              git diff --name-only shared/types/db-types.d.ts
            fi

        - name: Get PR author information
          if: steps.git-check.outputs.changes == 'true'
          id: pr-author
          run: |
            PR_AUTHOR_NAME="${{ github.event.pull_request.user.login }}"
            PR_AUTHOR_EMAIL="${PR_AUTHOR_NAME}@users.noreply.github.com"

            if [ -n "$PR_AUTHOR_NAME" ]; then
              REAL_EMAIL=$(gh api /users/${PR_AUTHOR_NAME} --jq '.email' 2>/dev/null || echo "")
              if [ -n "$REAL_EMAIL" ] && [ "$REAL_EMAIL" != "null" ]; then
                PR_AUTHOR_EMAIL="$REAL_EMAIL"
              fi
            fi

            echo "name=$PR_AUTHOR_NAME" >> $GITHUB_OUTPUT
            echo "email=$PR_AUTHOR_EMAIL" >> $GITHUB_OUTPUT
            
            echo "PR Author: $PR_AUTHOR_NAME <$PR_AUTHOR_EMAIL>"
          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        - name: Commit and push changes
          if: steps.git-check.outputs.changes == 'true'
          run: |
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git add shared/types/db-types.d.ts

            COMMIT_MESSAGE="chore: auto-regenerate database types from schema changes"

            if [ -n "${{ steps.pr-author.outputs.name }}" ]; then
              COMMIT_MESSAGE="${COMMIT_MESSAGE}

              Co-authored-by: ${{ steps.pr-author.outputs.name }} <${{ steps.pr-author.outputs.email }}>"
            fi

            git commit -m "$COMMIT_MESSAGE"
            
            git push origin HEAD:${{ github.head_ref || github.ref_name }}

            echo "Changes committed + pushed successfully"

        - name: Comment on PR
          if: steps.git-check.outputs.changes == 'true' && github.event_name == 'pull_request'
          uses: actions/github-script@v7
          with:
            script: |
              const comment = `**Database Types Auto-Regenerated**
              
              The database schema has changed and the shared TypeScript definitions were regenerated:
            
              - \`shared/types/db-types.d.ts\`
              
              All lambdas consume these types through the \`@branch/types\` package, so they are now in sync with the schema changes.`;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });

        - name: Comment on PR if no changes
          if: steps.git-check.outputs.changes != 'true' && github.event_name == 'pull_request'
          uses: actions/github-script@v7
          with:
            script: |
              const comment = `**Database Types Check Complete**
                
              The database schema files were modified, but the regenerated TypeScript types are identical to the existing ones.

              No changes were needed and the type definitions are already up to date.`;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
        
        - name: Workflow summary
          if: always()
          run: |
            echo "## 🔄 Database Type Regeneration Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            if [ "${{ steps.git-check.outputs.changes }}" == "true" ]; then
              echo "### Status: Types Regenerated Successfully" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "The following files were updated and committed:" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "- \`shared/types/db-types.d.ts\`" >> $GITHUB_STEP_SUMMARY

              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Next Steps:** The changes have been automatically committed to this PR. Review the updated types and merge when ready." >> $GITHUB_STEP_SUMMARY
            else
              echo "### Status: No Changes Needed" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "The regenerated types are identical to the existing ones." >> $GITHUB_STEP_SUMMARY
              echo "Your type definitions are already in sync with the schema." >> $GITHUB_STEP_SUMMARY
            fi
            
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "---" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Workflow Trigger:** Schema change detected in:" >> $GITHUB_STEP_SUMMARY
            echo "- \`apps/backend/db/migrations/**\`" >> $GITHUB_STEP_SUMMARY
        




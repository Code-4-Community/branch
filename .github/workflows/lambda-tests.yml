name: Lambda Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      lambdas: ${{ steps.find.outputs.lambdas }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Find all lambdas
        id: find
        run: |
          lambdas=$(ls -d apps/backend/lambdas/*/ | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "lambdas=$lambdas" >> $GITHUB_OUTPUT

  test:
    needs: discover
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    
    strategy:
      fail-fast: false
      matrix:
        lambda: ${{ fromJson(needs.discover.outputs.lambdas) }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Debug - find schema file
        run: |
          echo "Looking for SQL files:"
          find . -name "*.sql" | head -20
          echo ""
          echo "Contents of apps/backend/:"
          ls -la apps/backend/ || echo "apps/backend/ doesn't exist"
          echo ""
          echo "Looking for db folders:"
          find . -type d -name "db" | head -10

      - name: Setup database schema
        run: psql postgres://test:test@localhost:5432/testdb -f apps/backend/db/schema.sql
      
      - name: Install dependencies
        working-directory: ${{ matrix.lambda }}
        run: npm ci --legacy-peer-deps
      
      - name: Run tests
        working-directory: ${{ matrix.lambda }}
        run: npm test
# .github/workflows/lambda-tests.yml
name: Lambda Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      lambdas: ${{ steps.find.outputs.lambdas }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Find all lambdas
        id: find
        run: |
          lambdas=$(ls -d apps/backend/lambdas/*/ | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "lambdas=$lambdas" >> $GITHUB_OUTPUT

  test:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lambda: ${{ fromJson(needs.discover.outputs.lambdas) }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        working-directory: ${{ matrix.lambda }}
        run: npm ci
      
      - name: Run tests
        working-directory: ${{ matrix.lambda }}
        run: npm test
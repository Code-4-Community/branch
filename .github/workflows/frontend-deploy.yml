name: Frontend Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/frontend/**'
  workflow_dispatch:

# Requires the OIDC apply role (branch-ci-apply) from infrastructure/aws/oidc.tf
# to exist. Deploys the static export to S3 + invalidates CloudFront.
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write # assume the OIDC apply role
      contents: read
      pull-requests: write # deploy-notify PR comment
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure AWS credentials (write apply role via OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::489881683177:role/branch-ci-apply
          aws-region: us-east-2

      - name: Resolve backend API base URL
        run: |
          API_ID=$(aws apigateway get-rest-apis --query "items[?name=='branch-api'].id | [0]" --output text)
          echo "NEXT_PUBLIC_API_BASE_URL=https://$API_ID.execute-api.us-east-2.amazonaws.com/prod" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build (static export)
        run: npm run build

      - name: Resolve S3 bucket + CloudFront distribution
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "BUCKET=branch-frontend-$ACCOUNT_ID" >> "$GITHUB_ENV"
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='branch frontend (static SPA)'].Id | [0]" \
            --output text)
          echo "DIST_ID=$DIST_ID" >> "$GITHUB_ENV"

      - name: Sync to S3
        run: aws s3 sync out "s3://$BUCKET" --delete 2>&1 | tee -a deploy.log

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*" 2>&1 | tee -a deploy.log
          echo "Deployed apps/frontend to s3://$BUCKET and invalidated $DIST_ID" | tee -a deploy.log

      - name: Collect deploy details
        if: always()
        id: details
        run: |
          echo "log<<__EOF__" >> "$GITHUB_OUTPUT"
          tail -n 60 deploy.log 2>/dev/null >> "$GITHUB_OUTPUT" || echo "(no output captured)" >> "$GITHUB_OUTPUT"
          echo "__EOF__" >> "$GITHUB_OUTPUT"

      - name: Notify
        if: always()
        uses: ./.github/actions/deploy-notify
        with:
          status: ${{ job.status }}
          title: Frontend Deploy
          summary: ${{ job.status == 'success' && 'Frontend deployed to S3 + CloudFront' || 'Frontend deploy failed' }}
          details: ${{ steps.details.outputs.log }}
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

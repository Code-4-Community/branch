name: Frontend Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/frontend/**'
      # The authorization policy is compiled into the browser bundle, so a
      # change to shared/rbac has to redeploy the frontend or the two sides
      # stop agreeing.
      - 'shared/rbac/**'
  workflow_dispatch:

# Requires the OIDC apply role (branch-ci-apply) from infrastructure/aws/oidc.tf.
# Deploys the static export to S3 + CloudFront and reports a threaded status to
# #branch-deployments (initial message → per-step threads → complete/fail).
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # apps/frontend consumes @branch/rbac as a file: dependency and its dist
      # is gitignored, so npm ci cannot resolve it until this has run. npm does
      # not run `prepare` for a file: directory dep -- it symlinks -- so the
      # build has to be explicit. The job's defaults.run working-directory does
      # not reach a composite action's steps, so this runs from the repo root.
      - name: Build shared packages
        uses: ./.github/actions/build-shared-packages

      - name: Configure AWS credentials (write apply role via OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/branch-ci-apply
          aws-region: us-east-2

      - name: Start deploy notification
        id: slack
        uses: ./.github/actions/slack-deploy
        with:
          mode: start
          component: frontend
          total-steps: '3'
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve backend API base URL
        run: |
          API_ID=$(aws apigateway get-rest-apis --query "items[?name=='branch-api'].id | [0]" --output text)
          echo "NEXT_PUBLIC_API_BASE_URL=https://$API_ID.execute-api.us-east-2.amazonaws.com/prod" >> "$GITHUB_ENV"

      # ── Step 1: build ────────────────────────────────────────────
      - name: Build static export
        run: |
          npm ci 2>&1 | tee "$RUNNER_TEMP/build.log"
          npm run build 2>&1 | tee -a "$RUNNER_TEMP/build.log"
      - name: Thread — built
        if: success()
        uses: ./.github/actions/slack-deploy
        with:
          mode: step
          component: frontend
          total-steps: '3'
          step-index: '1'
          step-name: Built static export
          details-file: ${{ runner.temp }}/build.log
          ts: ${{ steps.slack.outputs.ts }}
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ── Step 2: sync ─────────────────────────────────────────────
      - name: Sync to S3
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "BUCKET=branch-frontend-$ACCOUNT_ID" >> "$GITHUB_ENV"
          aws s3 sync out "s3://branch-frontend-$ACCOUNT_ID" --delete 2>&1 | tee "$RUNNER_TEMP/sync.log"
      - name: Thread — synced
        if: success()
        uses: ./.github/actions/slack-deploy
        with:
          mode: step
          component: frontend
          total-steps: '3'
          step-index: '2'
          step-name: Synced build to S3
          details-file: ${{ runner.temp }}/sync.log
          ts: ${{ steps.slack.outputs.ts }}
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ── Step 3: invalidate ───────────────────────────────────────
      - name: Invalidate CloudFront
        run: |
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='branch frontend (static SPA)'].Id | [0]" \
            --output text)
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*" 2>&1 | tee "$RUNNER_TEMP/invalidate.log"
      - name: Thread — invalidated
        if: success()
        uses: ./.github/actions/slack-deploy
        with:
          mode: step
          component: frontend
          total-steps: '3'
          step-index: '3'
          step-name: Invalidated CloudFront cache
          details-file: ${{ runner.temp }}/invalidate.log
          ts: ${{ steps.slack.outputs.ts }}
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ── Complete ─────────────────────────────────────────────────
      - name: Thread — complete
        if: success()
        uses: ./.github/actions/slack-deploy
        with:
          mode: complete
          component: frontend
          total-steps: '3'
          step-index: '3'
          ts: ${{ steps.slack.outputs.ts }}
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ── Failure ──────────────────────────────────────────────────
      - name: Collect failure logs
        if: failure()
        run: cat "$RUNNER_TEMP"/build.log "$RUNNER_TEMP"/sync.log "$RUNNER_TEMP"/invalidate.log > "$RUNNER_TEMP/fail.log" 2>/dev/null || true
      - name: Thread — failed
        if: failure()
        uses: ./.github/actions/slack-deploy
        with:
          mode: fail
          component: frontend
          total-steps: '3'
          step-name: build/sync/invalidate — see workflow run
          details-file: ${{ runner.temp }}/fail.log
          ts: ${{ steps.slack.outputs.ts }}
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

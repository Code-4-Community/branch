name: PR Reviewer Assignment

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: pr-assign-rotation
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  assign-reviewer:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - name: Checkout bot-state branch
        uses: actions/checkout@v4
        with:
          ref: bot-state
          path: bot-state
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assign reviewer and notify Slack
        uses: actions/github-script@v7
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const BOT_STATE_DIR = 'bot-state';
            const rotationPath = path.join(BOT_STATE_DIR, 'rotation.json');
            const prsDir = path.join(BOT_STATE_DIR, 'prs');

            // ── Load rotation state ─────────────────────────────────
            if (!fs.existsSync(rotationPath)) {
              core.setFailed('rotation.json not found on bot-state branch. Run Terraform to initialize.');
              return;
            }
            const rotation = JSON.parse(fs.readFileSync(rotationPath, 'utf8'));

            // ── PR metadata ─────────────────────────────────────────
            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const prAuthor = pr.user.login;
            const prUrl = pr.html_url;
            const prTitle = pr.title;
            const repoFullName = `${context.repo.owner}/${context.repo.repo}`;
            const prFileKey = `${context.repo.owner}_${context.repo.repo}_${prNumber}`;
            const prFilePath = path.join(prsDir, `${prFileKey}.json`);

            // ── Ensure prs/ directory exists ─────────────────────────
            if (!fs.existsSync(prsDir)) {
              fs.mkdirSync(prsDir, { recursive: true });
            }

            // ── Helper: post a Slack message ─────────────────────────
            async function postSlack(msg) {
              try {
                const resp = await fetch('https://slack.com/api/chat.postMessage', {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    Authorization: `Bearer ${process.env.SLACK_BOT_TOKEN}`,
                  },
                  body: JSON.stringify(msg),
                });
                const data = await resp.json();
                if (data.ok) {
                  console.log(`Slack message posted (ts: ${data.ts})`);
                  return data.ts;
                }
                console.log(`Slack error: ${data.error}`);
              } catch (err) {
                console.log(`Slack post failed: ${err.message}`);
              }
              return null;
            }

            // ── Idempotency: PR already tracked ──────────────────────
            if (fs.existsSync(prFilePath)) {
              const existing = JSON.parse(fs.readFileSync(prFilePath, 'utf8'));

              if (existing.status === 'open') {
                console.log(`PR #${prNumber} already has reviewer ${existing.main_reviewer}. Skipping.`);
                return;
              }

              // PR was closed/reviewed/merged but reopened — re-notify, keep same reviewer
              console.log(`PR #${prNumber} was "${existing.status}", now reopened. Re-notifying.`);
              existing.status = 'open';
              existing.last_reminded_at = null;

              try {
                await github.rest.pulls.requestReviewers({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  reviewers: [existing.main_reviewer],
                });
              } catch (err) {
                console.log(`Warning: could not re-request review from ${existing.main_reviewer}: ${err.message}`);
              }

              const ts = await postSlack({
                channel: rotation.slack_channel_id,
                text: `PR reopened: <${prUrl}|#${prNumber} ${prTitle}>`,
                blocks: [
                  {
                    type: 'section',
                    text: {
                      type: 'mrkdwn',
                      text: `*Reopened:* *<${prUrl}|#${prNumber} ${prTitle}>*\nAuthor: *${prAuthor}*`,
                    },
                  },
                  {
                    type: 'section',
                    text: {
                      type: 'mrkdwn',
                      text: `:mag: *Main reviewer:* <@${existing.main_reviewer_slack}>\n:eyes: *Also reviewing:* <@${rotation.always_reviewer_slack}>`,
                    },
                  },
                ],
              });
              if (ts) existing.slack_thread_ts = ts;

              fs.writeFileSync(prFilePath, JSON.stringify(existing, null, 2) + '\n');
              return;
            }

            // ── Round-robin: pick next reviewer ──────────────────────
            const roster = rotation.roster;
            let cursor = rotation.cursor || 0;
            let mainReviewer = null;
            let newCursor = cursor;

            for (let i = 0; i < roster.length; i++) {
              const idx = (cursor + i) % roster.length;
              const candidate = roster[idx];
              if (candidate.toLowerCase() !== prAuthor.toLowerCase()) {
                mainReviewer = candidate;
                newCursor = (idx + 1) % roster.length;
                break;
              }
            }

            // Fallback: if the only person in the roster is the author,
            // assign the always-reviewer instead.
            if (!mainReviewer) {
              const alwaysEntry = Object.entries(rotation.github_to_slack).find(
                ([, slackId]) => slackId === rotation.always_reviewer_slack
              );
              if (alwaysEntry) {
                mainReviewer = alwaysEntry[0];
              } else {
                core.setFailed('No eligible reviewer found and could not determine always-reviewer.');
                return;
              }
              newCursor = (cursor + 1) % roster.length;
            }

            const mainReviewerSlack = rotation.github_to_slack[mainReviewer];
            if (!mainReviewerSlack) {
              core.setFailed(`No Slack ID mapping found for reviewer "${mainReviewer}".`);
              return;
            }

            console.log(`Assigning ${mainReviewer} to PR #${prNumber} (author: ${prAuthor}, cursor: ${cursor} → ${newCursor})`);

            // ── Request review on GitHub ─────────────────────────────
            try {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                reviewers: [mainReviewer],
              });
              console.log(`Review requested from ${mainReviewer}`);
            } catch (err) {
              console.log(`Warning: could not request review from ${mainReviewer}: ${err.message}`);
            }

            // ── Post Slack notification ──────────────────────────────
            const slackTs = await postSlack({
              channel: rotation.slack_channel_id,
              text: `New PR for review: <${prUrl}|#${prNumber} ${prTitle}>`,
              blocks: [
                {
                  type: 'section',
                  text: {
                    type: 'mrkdwn',
                    text: `*<${prUrl}|#${prNumber} ${prTitle}>*\nAuthor: *${prAuthor}*`,
                  },
                },
                {
                  type: 'section',
                  text: {
                    type: 'mrkdwn',
                    text: `:mag: *Main reviewer:* <@${mainReviewerSlack}>\n:eyes: *Also reviewing:* <@${rotation.always_reviewer_slack}>`,
                  },
                },
              ],
            });

            // ── Persist state ────────────────────────────────────────
            rotation.cursor = newCursor;
            fs.writeFileSync(rotationPath, JSON.stringify(rotation, null, 2) + '\n');

            const prData = {
              pr_url: prUrl,
              repo: repoFullName,
              pr_number: prNumber,
              author: prAuthor,
              main_reviewer: mainReviewer,
              main_reviewer_slack: mainReviewerSlack,
              created_at: new Date().toISOString(),
              last_reminded_at: null,
              slack_thread_ts: slackTs,
              status: 'open',
            };
            fs.writeFileSync(prFilePath, JSON.stringify(prData, null, 2) + '\n');
            console.log(`State written: cursor=${newCursor}, file=${prFilePath}`);

      - name: Commit and push bot-state
        working-directory: bot-state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "bot: assign reviewer for PR #${{ github.event.pull_request.number }}"

          for attempt in 1 2 3; do
            if git pull --rebase origin bot-state && git push origin bot-state; then
              echo "Push succeeded (attempt $attempt)"
              exit 0
            fi
            echo "Push attempt $attempt failed, retrying in 2s…"
            sleep 2
          done

          echo "::error::Failed to push bot-state after 3 attempts"
          exit 1

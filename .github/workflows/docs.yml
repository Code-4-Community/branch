name: Auto-format & Documentation

on:
  pull_request:
    branches: [main, develop]
  merge_group:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  auto-docs:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0

      - name: Get changed terraform files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            **/*.tf
            **/*.tfvars
            **/terraform.lock.hcl
            **/.terraform-version

      - name: Extract unique terraform directories
        id: tf-dirs
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          dirs=$(echo "${{ steps.changed-files.outputs.all_changed_files }}" | \
            tr ' ' '\n' | \
            xargs -I {} dirname {} | \
            sort -u)
          echo "dirs<<EOF" >> $GITHUB_OUTPUT
          echo "$dirs" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Install tfenv
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          git clone --depth=1 https://github.com/tfutils/tfenv.git ~/.tfenv
          echo "$HOME/.tfenv/bin" >> $GITHUB_PATH

      - name: Install terraform-docs
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          curl -sSLo ./terraform-docs.tar.gz https://terraform-docs.io/dl/v0.17.0/terraform-docs-v0.17.0-$(uname)-amd64.tar.gz
          tar -xzf terraform-docs.tar.gz
          chmod +x terraform-docs
          sudo mv terraform-docs /usr/local/bin/

      - name: Format terraform and generate docs
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            echo "Processing directory: $dir"

            cd "$dir"
            tfenv install

            echo "Formatting Terraform files in $dir"
            terraform fmt -recursive

            echo "Generating documentation for $dir"
            if [ -f "README.md" ]; then
              terraform-docs markdown table . --output-file README.md --output-mode inject
            else
              printf '# Terraform Module\n\n<!-- BEGIN_TF_DOCS -->\n<!-- END_TF_DOCS -->\n' > README.md
              terraform-docs markdown table . --output-file README.md --output-mode inject
            fi

            cd - > /dev/null
          done <<< "${{ steps.tf-dirs.outputs.dirs }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate lambda READMEs
        working-directory: apps/backend/lambdas
        run: node tools/lambda-cli.js generate-readme

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add '*.tf' '**/*.tf'
          git add '*.md' '**/*.md'

          if git diff --staged --quiet; then
            echo "No documentation changes to commit"
          else
            git commit -m "chore: auto-format and update documentation

          Co-authored-by: ${{ github.event.pull_request.user.login }} <${{ github.event.pull_request.user.login }}@users.noreply.github.com>"

            git push
          fi

  auto-docs-status:
    if: always()
    needs: [auto-docs]
    runs-on: ubuntu-latest
    steps:
      - name: Check status
        run: |
          if [ "${{ github.event_name }}" == "merge_group" ]; then
            echo "Merge queue — docs already committed during PR. Skipping."
            exit 0
          fi
          if [ "${{ needs.auto-docs.result }}" == "failure" ]; then
            echo "auto-docs failed"
            exit 1
          fi
          echo "auto-docs passed"

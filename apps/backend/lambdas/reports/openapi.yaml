openapi: 3.0.3
info:
  title: reports (Local)
  version: 1.0.0
servers:
  - url: http://localhost:3000/reports
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  /reports:
    get:
      summary: GET /reports — paginated list
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          description: Page number (requires limit)
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
          description: Items per page (requires page)
        - in: query
          name: projectId
          schema:
            type: integer
            minimum: 1
          description: Filter reports by project
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        report_id:
                          type: integer
                        project_id:
                          type: integer
                        object_url:
                          type: string
                        date_created:
                          type: string
                          format: date
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      totalItems:
                        type: integer
                      totalPages:
                        type: integer
        '400':
          description: Invalid pagination params
        '401':
          description: Unauthorized

  /reports/upload-url:
    get:
      summary: Get a pre-signed S3 URL for uploading a report file
      parameters:
        - in: query
          name: fileName
          required: true
          schema:
            type: string
          description: File name with extension (pdf or docx)
        - in: query
          name: projectId
          required: true
          schema:
            type: integer
            minimum: 1
          description: Project the report belongs to
      responses:
        '200':
          description: Pre-signed upload URL and final object URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadUrl:
                    type: string
                    description: Pre-signed S3 PUT URL (expires in 1 hour)
                  objectUrl:
                    type: string
                    description: Permanent S3 URL to pass to POST /reports
        '400':
          description: Invalid fileName or projectId
        '401':
          description: Unauthorized
        '404':
          description: Project not found

  /reports:
    post:
      summary: POST /reports — create a report record after uploading the file to S3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - projectId
                - objectUrl
              properties:
                title:
                  type: string
                projectId:
                  type: integer
                  minimum: 1
                objectUrl:
                  type: string
                  description: S3 object URL returned by GET /reports/upload-url
      responses:
        '201':
          description: Report created
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '404':
          description: Project not found

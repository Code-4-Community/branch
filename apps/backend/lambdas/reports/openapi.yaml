openapi: 3.0.3
info:
  title: reports (Local)
  version: 1.0.0
servers:
  - url: http://localhost:3005/reports
  - url: http://localhost:3000/reports
security:
  - BearerAuth: []
paths:
  /health:
    get:
      summary: Health check
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  /reports:
    get:
      summary: GET /reports — paginated list
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          description: Page number (requires limit)
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
          description: Items per page (requires page)
        - in: query
          name: projectId
          schema:
            type: integer
            minimum: 1
          description: Filter reports by project
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        report_id:
                          type: integer
                        project_id:
                          type: integer
                        object_url:
                          type: string
                        date_created:
                          type: string
                          format: date
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      totalItems:
                        type: integer
                      totalPages:
                        type: integer
        '400':
          description: Invalid pagination params
        '401':
          description: Unauthorized
    post:
      summary: Generate a project report (PDF or DOCX)
      description: >
        Generates a report for the given project containing project info,
        participants and roles, donations, and expenditures. Supports PDF and
        DOCX output via the `file_type` field (defaults to `pdf`). Uploads the
        file to S3 and records it in the database. Requires the caller to be a
        member of the project or a global admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - project_id
              properties:
                project_id:
                  type: integer
                  description: The ID of the project to generate a report for
                  example: 1
                file_type:
                  type: string
                  enum: [pdf, docx]
                  default: pdf
                  description: Output format: "pdf" (default) or "docx"
                  example: docx
      responses:
        '201':
          description: Report generated and uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  report_id:
                    type: integer
                  object_url:
                    type: string
        '400':
          description: Invalid input
        '401':
          description: Authentication required
        '403':
          description: Not a member of this project
        '404':
          description: Project not found
        '500':
          description: Internal server error
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

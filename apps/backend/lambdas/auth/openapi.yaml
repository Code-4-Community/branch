openapi: 3.0.3
info:
  title: auth (Local)
  version: 1.0.0
servers:
  - url: /auth
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  /register:
    post:
      summary: Register a new user
      description: Creates a new user account in Cognito and the database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - name
              properties:
                email:
                  type: string
                  format: email
                  description: User's email address (will be normalized to lowercase)
                  example: user@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: Password (min 8 chars, must contain uppercase, lowercase, and number)
                  example: Password123
                name:
                  type: string
                  minLength: 2
                  description: User's full name
                  example: John Doe
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User registered successfully
                  userId:
                    type: string
                    description: Cognito user ID (sub)
                    example: cognito-user-123
                  email:
                    type: string
                    example: user@example.com
                  name:
                    type: string
                    example: John Doe
                  emailVerificationRequired:
                    type: boolean
                    example: true
                  details:
                    type: string
                    example: Please check your email for verification code
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Invalid email format
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User with this email already exists
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Failed to create user account

  /login:
    post:
      summary: Log in a user
      description: >
        Authenticates with email and password via Cognito USER_PASSWORD_AUTH.
        A 200 is either a token set OR an auth challenge -- branch on the
        presence of ChallengeName. Complete challenges at
        POST /auth/respond-challenge using the returned Session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: Password123
      responses:
        '200':
          description: Tokens, or the next auth challenge
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TokenSet'
                  - $ref: '#/components/schemas/AuthChallenge'
        '400':
          description: email and password are required
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Invalid email or password
        '403':
          description: >
            Email not verified, password reset required, or MFA enrollment
            required (MFA_SETUP, which returns a Session but is not yet
            answerable)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Email not verified
        '429':
          description: Too many attempts
        '500':
          description: Authentication failed

  /respond-challenge:
    post:
      summary: Complete a Cognito auth challenge
      description: >
        Answers the challenge returned by POST /auth/login using the opaque
        Session string. NEW_PASSWORD_REQUIRED is reachable today;
        SOFTWARE_TOKEN_MFA, SMS_MFA, EMAIL_OTP and SELECT_MFA_TYPE are already
        wired and become reachable as soon as mfa_configuration is enabled on
        the user pool -- no code change. The response is itself either a token
        set or a further challenge, because challenges chain.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - challengeName
                - session
                - email
              properties:
                challengeName:
                  type: string
                  enum:
                    - NEW_PASSWORD_REQUIRED
                    - SOFTWARE_TOKEN_MFA
                    - SMS_MFA
                    - EMAIL_OTP
                    - SELECT_MFA_TYPE
                session:
                  type: string
                  description: Opaque Session from the /auth/login response
                email:
                  type: string
                  format: email
                newPassword:
                  type: string
                  format: password
                  description: Required for NEW_PASSWORD_REQUIRED
                name:
                  type: string
                  description: >
                    Optional, only for NEW_PASSWORD_REQUIRED when the pool
                    requires the name attribute to be supplied
                code:
                  type: string
                  description: Required for SOFTWARE_TOKEN_MFA / SMS_MFA / EMAIL_OTP
                mfaType:
                  type: string
                  description: Required for SELECT_MFA_TYPE
      responses:
        '200':
          description: Tokens, or the next challenge
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TokenSet'
                  - $ref: '#/components/schemas/AuthChallenge'
        '400':
          description: Missing/invalid field, unsupported challengeName, or bad code
        '401':
          description: Challenge session is invalid or expired
        '429':
          description: Too many attempts

  /refresh:
    post:
      summary: Exchange a refresh token for new access and ID tokens
      description: >
        Cognito REFRESH_TOKEN_AUTH. No client secret is configured
        (generate_secret = false) so no SECRET_HASH is required. NOTE: no new
        RefreshToken is returned -- keep using the stored one until it expires
        (30 days, see infrastructure/aws/cognito.tf).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: New access and ID tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  AccessToken:
                    type: string
                  IdToken:
                    type: string
                  ExpiresIn:
                    type: integer
                    example: 3600
                  TokenType:
                    type: string
                    example: Bearer
        '400':
          description: refreshToken is required
        '401':
          description: Refresh token is invalid or expired
        '429':
          description: Too many requests

  /me:
    get:
      summary: Current session (canonical session bootstrap)
      description: >
        Verifies the Bearer access token and returns the caller's Postgres
        branch.users row. This is the ONLY way the frontend can learn isAdmin:
        it lives solely in Postgres and there is no pre-token-generation
        trigger, so it is not a JWT claim. email and name also come from the DB
        because a Cognito access token does not carry them.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: integer
                    example: 1
                  cognitoSub:
                    type: string
                  email:
                    type: string
                    format: email
                  name:
                    type: string
                  isAdmin:
                    type: boolean
                  profileImage:
                    type: string
                    nullable: true
        '401':
          description: Authentication required

  /verify-email:
    post:
      summary: POST /verify-email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                code:
                  type: string
      responses:
        '200':
          description: OK

  /resend-code:
    post:
      summary: POST /resend-code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
      responses:
        '200':
          description: OK

  /logout:
    post:
      summary: Sign out everywhere
      description: >
        Cognito GlobalSignOut on the Bearer access token. This revokes the
        refresh token pool-wide for that user, so every other session for the
        same account also stops being renewable.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged out successfully
        '401':
          description: Missing Authorization header, or invalid/expired token

  /forgot-password:
    post:
      summary: Request a password reset code
      description: Sends a verification code to the user's email for password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
      responses:
        '200':
          description: Reset code sent (or generic message if user not found)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Password reset code sent
                  deliveryMedium:
                    type: string
                    example: EMAIL
                  destination:
                    type: string
                    example: u***@e***.com
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Too many requests, please try again later

  /reset-password:
    post:
      summary: Reset password with verification code
      description: Confirms the password reset using the code sent to the user's email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - code
                - newPassword
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                code:
                  type: string
                  example: "123456"
                newPassword:
                  type: string
                  format: password
                  minLength: 8
                  description: New password (min 8 chars, must contain uppercase, lowercase, and number)
                  example: NewPassword123
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Password reset successfully
        '400':
          description: Invalid code or password
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Invalid verification code
        '429':
          description: Too many attempts
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Too many attempts, please try again later

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito access token, as returned by POST /auth/login
  schemas:
    TokenSet:
      type: object
      properties:
        AccessToken:
          type: string
        IdToken:
          type: string
        RefreshToken:
          type: string
          description: Absent on POST /auth/refresh -- Cognito does not re-issue it
        ExpiresIn:
          type: integer
          example: 3600
        TokenType:
          type: string
          example: Bearer
    AuthChallenge:
      type: object
      required:
        - ChallengeName
        - Session
      properties:
        ChallengeName:
          type: string
          enum:
            - NEW_PASSWORD_REQUIRED
            - SOFTWARE_TOKEN_MFA
            - SMS_MFA
            - EMAIL_OTP
            - SELECT_MFA_TYPE
            - MFA_SETUP
        Session:
          type: string
          description: Opaque; pass back to POST /auth/respond-challenge
        ChallengeParameters:
          type: object
          additionalProperties:
            type: string
        message:
          type: string

openapi: 3.0.3
info:
  title: donors (Local)
  version: 1.0.0
servers:
  - url: http://localhost:3000/donors
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
  /donors:
    get:
      summary: GET /donors
      responses:
        '200':
          description: OK
    post:
      summary: POST /donors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                organization:
                  type: string
                contact_name:
                  type: string
                contact_email:
                  type: string
      responses:
        '201':
          description: Success
  /donations:
    post:
      summary: POST /donations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                donor_id:
                  type: integer
                project_id:
                  type: integer
                amount:
                  type: number
      responses:
        '201':
          description: Success
  /donors/{id}:
    delete:
      summary: DELETE /donors/{id}
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /donations/{id}:
    delete:
      summary: DELETE /donations/{id}
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
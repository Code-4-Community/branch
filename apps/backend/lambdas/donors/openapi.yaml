openapi: 3.0.3
info:
  title: donors (Local)
  version: 1.0.0
servers:
  - url: http://localhost:3000
paths:
  /donors/health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
  /donors:
    get:
      summary: GET /donors
      responses:
        '200':
          description: OK
    post:
      summary: POST /donors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                organization:
                  type: string
                contact_name:
                  type: string
                contact_email:
                  type: string
      responses:
        '201':
          description: Success
  /donors/donations:
    get:
      summary: GET /donors/donations — paginated list
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          description: Page number (requires limit)
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
          description: Items per page (requires page)
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      totalItems:
                        type: integer
                      totalPages:
                        type: integer
        '400':
          description: Invalid pagination params
        '401':
          description: Unauthorized
    post:
      summary: POST /donors/donations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                donor_id:
                  type: integer
                project_id:
                  type: integer
                amount:
                  type: number
                donated_at:
                  type: string
                  format: date
                  description: >-
                    Optional. Defaults to now(); supply it to backdate a
                    donation to when it was actually received.
      responses:
        '201':
          description: Success
  /donors/{id}:
    delete:
      summary: DELETE /donors/{id}
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /donors/donations/{id}:
    delete:
      summary: DELETE /donors/donations/{id}
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK

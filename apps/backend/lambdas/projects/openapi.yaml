openapi: 3.0.3
info:
  title: Projects (Local)
  version: 1.0.0
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  /projects/{id}/members:
    get:
      summary: GET /projects/{id}/members
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
  /projects:
    get:
      summary: GET /projects
      responses:
        '200':
          description: OK
    post:
      summary: POST /projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                total_budget:
                  type: number
                description:
                  type: string
      responses:
        '200':
          description: OK

  /projects/{id}:
    get:
      summary: GET /projects/{id}
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
    put:
      summary: PUT /projects/{id}
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
    delete:
      summary: DELETE /projects/{id}
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request - id is required
        '404':
          description: Project not found
  /projects/{id}/expenditures:
    get:
      summary: GET /projects/{id}/expenditures
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /dashboard:
    get:
      summary: GET /dashboard
      description: >-
        Spend and staffing aggregates. An admin sees every project; anyone else
        sees only the projects they are a member of, and gets an empty dashboard
        when they are a member of none.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    type: object
                    properties:
                      topExpenseCategory:
                        type: object
                        nullable: true
                      totalSpent:
                        type: number
                      totalProjects:
                        type: integer
                      averageSpendPerProject:
                        type: number
                  projects:
                    type: array
                    items:
                      type: object
                      properties:
                        project_id:
                          type: integer
                        name:
                          type: string
                        total_budget:
                          type: number
                          nullable: true
                        currency:
                          type: string
                          nullable: true
                        spent:
                          type: number
                        staff_count:
                          type: integer
                        spent_percentage:
                          type: number
                  expensesByMonth:
                    type: array
                    items:
                      type: object
        '401':
          description: Unauthorized

  /projects/{id}/donors:
    get:
      summary: GET /projects/{id}/donors
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
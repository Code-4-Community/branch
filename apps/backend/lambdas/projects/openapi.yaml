openapi: 3.0.3
info:
  title: Projects (Local)
  version: 1.0.0
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  /projects/{id}/members:
    get:
      summary: GET /projects/{id}/members
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
  /projects:
    post:
      summary: POST /projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: 
                - name
              properties:
                name:
                  type: string
                total_budget:
                  type: number
                description:
                  type: string
      responses:
        '200':
          description: OK

openapi: 3.0.3
info:
  title: Projects (Local)
  version: 1.0.0
servers:
  - url: /
paths:
  /projects/health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  /projects/{id}/members:
    get:
      summary: GET /projects/{id}/members
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
  /projects:
    get:
      summary: GET /projects
      responses:
        '200':
          description: OK
    post:
      summary: POST /projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                total_budget:
                  type: number
                description:
                  type: string
      responses:
        '200':
          description: OK

  /projects/{id}:
    get:
      summary: GET /projects/{id}
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
    put:
      summary: PUT /projects/{id}
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /projects/{id}/expenditures:
    get:
      summary: GET /projects/{id}/expenditures
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /projects/dashboard:
    get:
      summary: GET /dashboard
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /projects/{id}/donors:
    get:
      summary: GET /projects/{id}/donors
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
      

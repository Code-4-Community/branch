openapi: 3.0.3
info:
  title: users (Local)
  version: 1.0.0
servers:
  - url: http://localhost:3000/users
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  /users:
    get:
      summary: GET /users
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: OK

openapi: 3.0.3
info:
  title: expenditures (Local)
  version: 1.0.0
servers:
  - url: http://localhost:3000
paths:
  /expenditures/health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
  /expenditures:
    get:
      summary: GET /expenditures — paginated list
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          description: Page number (requires limit)
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
          description: Items per page (requires page)
        - in: query
          name: projectId
          schema:
            type: integer
            minimum: 1
          description: Filter expenditures by project
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      totalItems:
                        type: integer
                      totalPages:
                        type: integer
        '400':
          description: Invalid pagination params
        '401':
          description: Unauthorized
    post:
      summary: POST /expenditures
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - projectID
                - amount
              properties:
                projectID:
                  type: number
                amount:
                  type: number
                category:
                  type: string
                description:
                  type: string
                status:
                  type: string
                  enum: [approved, pending, denied, needs_more_info]
                  default: pending
                receipt_url:
                  type: string
                  nullable: true
                spentOn:
                  type: string
                  format: date
      responses:
        '201':
          description: Success
  /expenditures/upload-url:
    get:
      summary: Get a pre-signed S3 URL for uploading a receipt
      parameters:
        - in: query
          name: fileName
          required: true
          schema:
            type: string
          description: PDF file name
        - in: query
          name: projectId
          required: true
          schema:
            type: integer
            minimum: 1
          description: Project the expenditure belongs to
      responses:
        '200':
          description: Pre-signed upload URL and final object URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadUrl:
                    type: string
                  objectUrl:
                    type: string
        '400':
          description: Invalid fileName or projectId
        '401':
          description: Authentication required
        '403':
          description: Unable to upload a receipt for this project
  /expenditures/{id}:
    get:
      summary: GET /expenditures/{id}
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
    patch:
      summary: PATCH /expenditures/{id}
      description: >
        Revise an expenditure. Allowed for the submitter until an admin approves
        it, and for an admin at any time. `status` and `adminNotes` are rejected
        here -- they are admin-only and live on PATCH /expenditures/{id}/status.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                amount:
                  type: number
                category:
                  type: string
                description:
                  type: string
                receiptUrl:
                  type: string
                spentOn:
                  type: string
                  format: date
      responses:
        '200':
          description: Expenditure updated
        '400':
          description: Invalid id, no editable fields, or an admin-only field was sent
        '401':
          description: Authentication required
        '403':
          description: Not the submitter, or the expenditure is already approved
        '404':
          description: Expenditure not found or not visible to the caller
    delete:
      summary: DELETE /expenditures/{id}
      description: >
        Allowed for the submitter until an admin approves it, and for an admin
        at any time.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '403':
          description: Not the submitter, or the expenditure is already approved
        '404':
          description: Expenditure not found or not visible to the caller
  /expenditures/{id}/receipt:
    get:
      summary: Get a pre-signed S3 URL for downloading an expenditure's receipt
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Pre-signed download URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  downloadUrl:
                    type: string
                  fileName:
                    type: string
        '400':
          description: id must be a positive integer
        '401':
          description: Authentication required
        '403':
          description: Unable to view this receipt
        '404':
          description: Expenditure not found, or has no receipt
        '422':
          description: Receipt is not stored in the receipts bucket
  /expenditures/{id}/status:
    patch:
      summary: PATCH /expenditures/{id}/status
      description: Approve or decline an expenditure. Admin only.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [approved, denied]
      responses:
        '200':
          description: Expenditure status updated
        '400':
          description: Invalid id or status
        '401':
          description: Authentication required
        '403':
          description: Admin access required
        '404':
          description: Expenditure not found
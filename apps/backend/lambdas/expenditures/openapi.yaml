openapi: 3.0.3
info:
  title: expenditures (Local)
  version: 1.0.0
servers:
  - url: http://localhost:3000/expenditures
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  /expenditures:
    get:
      summary: GET /expenditures — paginated list
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          description: Page number (requires limit)
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
          description: Items per page (requires page)
        - in: query
          name: projectId
          schema:
            type: integer
            minimum: 1
          description: Filter expenditures by project
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      totalItems:
                        type: integer
                      totalPages:
                        type: integer
        '400':
          description: Invalid pagination params
        '401':
          description: Unauthorized
    post:
      summary: POST /expenditures
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - projectID
                - amount
              properties:
                projectID:
                  type: number
                amount:
                  type: number
                category:
                  type: string
                description:
                  type: string
                status:
                  type: string
                  enum: [approved, pending, denied, needs_more_info]
                  default: pending
                receipt_url:
                  type: string
                  nullable: true
                spentOn:
                  type: string
                  format: date
      responses:
        '201':
          description: Success

  /expenditures/{id}:
    get:
      summary: GET /expenditures/{id}
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
    delete:
      summary: DELETE /expenditures/{id}
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK

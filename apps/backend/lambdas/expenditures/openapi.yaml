openapi: 3.0.3
info:
  title: expenditures (Local)
  version: 1.0.0
servers:
  - url: http://localhost:3000/expenditures
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
  /expenditures:
    get:
      summary: GET /expenditures — paginated list
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          description: Page number (requires limit)
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
          description: Items per page (requires page)
        - in: query
          name: projectId
          schema:
            type: integer
            minimum: 1
          description: Filter expenditures by project
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      totalItems:
                        type: integer
                      totalPages:
                        type: integer
        '400':
          description: Invalid pagination params
        '401':
          description: Unauthorized
    post:
      summary: POST /expenditures
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - projectID
                - amount
              properties:
                projectID:
                  type: number
                amount:
                  type: number
                category:
                  type: string
                description:
                  type: string
                status:
                  type: string
                  enum: [approved, pending, denied, needs_more_info]
                  default: pending
                receipt_url:
                  type: string
                  nullable: true
                spentOn:
                  type: string
                  format: date
      responses:
        '201':
          description: Success

  /expenditures/upload-url:
    get:
      summary: GET /expenditures/upload-url
      description: >-
        Mints a presigned S3 PUT for a PDF receipt. The browser uploads to
        `uploadUrl` directly, then passes `objectUrl` back as `receiptUrl` on
        POST /expenditures. Requires the same project role as creating an
        expenditure.
      parameters:
        - in: query
          name: fileName
          required: true
          schema:
            type: string
          description: Must end in .pdf.
        - in: query
          name: projectId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadUrl:
                    type: string
                    description: Presigned PUT, valid for one hour.
                  objectUrl:
                    type: string
        '400':
          description: fileName missing or not a PDF, or projectId invalid
        '401':
          description: Unauthorized
        '403':
          description: Caller may not record spending on this project
        '404':
          description: Project not found

  /expenditures/{id}:
    get:
      summary: GET /expenditures/{id}
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
    delete:
      summary: DELETE /expenditures/{id}
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /expenditures/{id}/status:
    patch:
      summary: PATCH /expenditures/{id}/status
      description: Approve or decline an expenditure. Admin only.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [approved, denied]
      responses:
        '200':
          description: Expenditure status updated
        '400':
          description: Invalid id or status
        '401':
          description: Authentication required
        '403':
          description: Admin access required
        '404':
          description: Expenditure not found
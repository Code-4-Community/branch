openapi: 3.0.3
info:
  title: expenditures (Local)
  version: 1.0.0
servers:
  - url: http://localhost:3000/expenditures
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  /expenditures:
    get:
      summary: GET /expenditures
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
        - name: projectId
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  pagination:
                    type: object
                    nullable: true
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      totalItems:
                        type: integer
                      totalPages:
                        type: integer
        '400':
          description: Invalid pagination parameters
    post:
      summary: POST /expenditures
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - projectID
                - amount
              properties:
                projectID:
                  type: number
                amount:
                  type: number
                category:
                  type: string
                description:
                  type: string
                spentOn:
                  type: string
                  format: date
      responses:
        '201':
          description: Success
